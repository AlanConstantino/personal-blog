<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Posts tagged {{tag}} on Alan's Blog." />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Alan's Blog RSS"
      href="/rss.xml"
    />
    <link rel="stylesheet" href="{{css_prefix}}css/normalize.css" />
    <link rel="stylesheet" href="{{css_prefix}}css/skeleton.css" />
    <link rel="stylesheet" href="{{css_prefix}}css/styles.css" />
    <link rel="canonical" href="{{canonical}}" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{{css_prefix}}images/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{css_prefix}}images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{css_prefix}}images/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="{{css_prefix}}images/favicon/site.webmanifest" />
    <title>Tag: {{tag}} — Alan's Blog</title>
  </head>
  <body>
    <header id="top">
      <div class="container">
        <h1>
          <a href="{{home_href}}">Alan Constantino</a>
        </h1>
        <h5>Posts tagged <span class="tag-label">{{tag}}</span></h5>
      </div>
    </header>
    <main>
      <div class="container">
        <div class="row center">
<!-- POSTS:START -->
{{posts}}
<!-- POSTS:END -->
        </div>
<!-- PAGER:START -->
{{pager}}
<!-- PAGER:END -->
      </div>
    </main>
    <footer>
      <div class="container">
        <div class="row">
          <a href="{{tags_index_href}}">&#8592; All tags</a>
          <a href="{{home_href}}">Home</a>
          <a href="#top">&#8593; Top &#8593;</a>
        </div>
        <div class="row">
          <p>&copy; AlanJC. All rights reserved.</p>
          <p>Subscribe via <a href="/rss.xml">RSS</a>.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
