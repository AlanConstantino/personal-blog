<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse Alan's Blog posts by tag." />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Alan's Blog RSS"
      href="/rss.xml"
    />
    <link rel="stylesheet" href="../css/normalize.css" />
    <link rel="stylesheet" href="../css/skeleton.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="canonical" href="https://blog.alanjc.com/tags/" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../images/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../images/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="../images/favicon/site.webmanifest" />
    <title>Tags — Alan's Blog</title>
  </head>
  <body>
    <header id="top">
      <div class="container">
        <h1>
          <a href="../">Alan Constantino</a>
        </h1>
        <h5>Browse by tag</h5>
      </div>
    </header>
    <main>
      <div class="container">
        <div class="row">
          <ul class="tag-list">
{{tag_items}}
          </ul>
        </div>
      </div>
    </main>
    <footer>
      <div class="container">
        <div class="row">
          <a href="../">&#8592; Home</a>
          <a href="#top">&#8593; Top &#8593;</a>
        </div>
        <div class="row">
          <p>&copy; AlanJC. All rights reserved.</p>
          <p>Subscribe via <a href="/rss.xml">RSS</a>.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
